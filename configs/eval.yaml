experiment_name: eval_baseline
seed: 42

data:
  train_source: data/splits/kaggle_mbti/train.jsonl
  val_source: data/splits/kaggle_mbti/val.jsonl
  eval_source: data/splits/kaggle_mbti/test.jsonl
  label_field: label
  text_field: text

model:
  source: baseline
  baseline:
    type: tfidf
    vectorizer:
      max_features: 50000
      min_df: 2
      ngram_range: [1, 2]
    classifier:
      c_value: 4.0
      max_iter: 2000
  # Alternative mode for already-generated predictions:
  # source: predictions
  # prediction_source: outputs/sft_baseline/predictions.jsonl

uncertainty:
  enabled: true
  calibration_bins: 10
  uncertainty_buckets: 5

stability:
  enabled: true
  subset_size: 256
  top_k: 3
  save_example_count: 30
  perturbations:
    - name: random_deletion
      delete_ratio: 0.1
    - name: sentence_shuffle
    - name: lexical_substitution
      max_replacements: 12

cri:
  enabled: true
  formula_mode: both
  primary_formula: multiplicative
  weight_mode: learned
  fallback_stability: 0.5
  bucket_count: 5
  uncertainty_signal:
    entropy_weight: 0.5
    inverse_margin_weight: 0.5
  learning:
    fit_fraction: 0.5
    grid_step: 0.05
  fixed_weights:
    uncertainty: 0.5

output_dir: outputs/eval_baseline
